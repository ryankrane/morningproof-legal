<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Morning Proof - Legal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #8C73BF 0%, #A894D6 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 400px;
        }
        h1 {
            font-size: 2em;
            margin-bottom: 10px;
            color: #1a1a1a;
        }
        .tagline {
            color: #666;
            margin-bottom: 30px;
        }
        .links {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        a {
            display: block;
            padding: 15px 30px;
            background: #8C73BF;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        a:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(140, 115, 191, 0.4);
        }
        .app-store {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }
        .app-store a {
            background: #000;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Morning Proof</h1>
        <p class="tagline">Build better mornings, one habit at a time</p>

        <div class="links">
            <a href="privacy.html">Privacy Policy</a>
            <a href="terms.html">Terms of Service</a>
        </div>

        <div class="app-store">
            <a href="https://apps.apple.com/app/id6757691737">Download on the App Store</a>
        </div>
    </div>
</body>
</html>
